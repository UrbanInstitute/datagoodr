url: ~
destination: docs
template:
  bootstrap: 5

# An "Examples" menu of finished research guides. The guides are self-contained
# pages built by data-raw/example-guides.R into pkgdown/assets/examples/, which
# pkgdown copies to <site>/examples/.
navbar:
  structure:
    left: [intro, reference, articles, examples, tutorials, news]
  components:
    examples:
      text: Examples
      menu:
      - text: How the examples are built
        href: articles/example-guides.html
      - text: -------
      - text: "Research guide demos"
      - text: Baseball players
        href: examples/baseball.html
      - text: Star Wars characters
        href: examples/starwars.html
      - text: Motor Trend cars
        href: examples/mtcars.html
      - text: -------
      - text: "Styles"
      - text: Baseball players, compact
        href: examples/baseball-compact.html

articles:
- title: User guide
  navbar: User guide
  contents:
  - getting-started
  - workflow-overview
  - data-governance-workflow
  - stabilizing-datasets
  - data-profiling
  - research-guides
  - example-guides
  - documenting-data
  - reporting-functions
  - report-styles
  - report-aesthetics
  - guessing-data-types

